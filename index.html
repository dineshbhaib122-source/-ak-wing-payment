<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>AK Wing Payment System</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

import {
getFirestore,
collection,
addDoc,
query,
where,
getDocs,
deleteDoc,
doc
}
from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

const firebaseConfig = {

apiKey: "YOUR_API_KEY",

authDomain: "YOUR_PROJECT.firebaseapp.com",

projectId: "YOUR_PROJECT_ID",

storageBucket: "YOUR_PROJECT.appspot.com",

messagingSenderId: "YOUR_SENDER_ID",

appId: "YOUR_APP_ID"

};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

const provider = new GoogleAuthProvider();

let currentUser = null;

window.login = async function () {

await signInWithPopup(auth, provider);

};

window.logout = async function () {

await signOut(auth);

};

onAuthStateChanged(auth, async (user) => {

if (user) {

currentUser = user;

document.getElementById("loginBox").style.display = "none";

document.getElementById("app").style.display = "block";

document.getElementById("user").innerText = user.displayName;

loadEntries();

}

});

window.saveEntry = async function () {

const flat = document.getElementById("flat").value;

const name = document.getElementById("name").value;

const date = document.getElementById("date").value;

const amount = document.getElementById("amount").value;

const mode = document.getElementById("mode").value;

await addDoc(collection(db, "payments"), {

uid: currentUser.uid,

flat,

name,

date,

amount,

mode

});

loadEntries();

};

window.loadEntries = async function () {

const q = query(

collection(db, "payments"),

where("uid", "==", currentUser.uid)

);

const snapshot = await getDocs(q);

let html = "";

snapshot.forEach((item) => {

const data = item.data();

html += `

<div class="entry">

<b>${data.flat}</b>

${data.name}

₹${data.amount}

${data.mode}

${data.date}

<button onclick="removeEntry('${item.id}')">

Delete

</button>

</div>

`;

});

document.getElementById("entries").innerHTML = html;

};

window.removeEntry = async function (id) {

await deleteDoc(doc(db, "payments", id));

loadEntries();

};
</script>

<style>
body{
font-family:Arial;
padding:20px;
background:#f5f5f5;
}

.card{
background:white;
padding:20px;
border-radius:10px;
margin-bottom:20px;
}

input,select,button{
width:100%;
padding:12px;
margin-top:10px;
}

.entry{
background:#eeeeee;
padding:10px;
margin-top:10px;
}
</style>

</head>

<body>

<div id="loginBox" class="card">

<h2>AK Wing Payment System</h2>

<button onclick="login()">

Login With Google

</button>

</div>

<div id="app" style="display:none;">

<div class="card">

<h3 id="user"></h3>

<select id="flat">

<option>A101</option>
<option>A102</option>
<option>B101</option>
<option>C101</option>
<option>D101</option>
<option>E101</option>
<option>F101</option>
<option>G101</option>
<option>H101</option>
<option>I101</option>
<option>J101</option>
<option>K101</option>

</select>

<input id="name" placeholder="Name">

<input type="date" id="date">

<input id="amount" type="number" placeholder="Amount">

<select id="mode">

<option>Cash</option>

<option>Online</option>

</select>

<button onclick="saveEntry()">

Save Entry

</button>

<button onclick="logout()">

Logout

</button>

</div>

<div class="card">

<h3>Entries</h3>

<div id="entries"></div>

</div>

</div>

</body>
</html>
